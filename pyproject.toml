[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tieny"
version = "0.2.1"
description = "A small local AI host with one Python API, CLI, Web UI, and pluggable model runtimes."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tieny" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "typer>=0.27",
  "rich>=13.9",
  "platformdirs>=4.3",
  "pydantic>=2.9",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3"]
dev = ["pytest>=8.3"]

[project.scripts]
tieny = "tieny.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tieny.webui" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
